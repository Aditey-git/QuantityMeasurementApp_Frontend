<div class="background">
  <div class="login-card">
    <h1 class="app-title">Quantity Measurement</h1>
    <p class="subtitle">Create your account</p>

    <form (ngSubmit)="register()">
      <div class="input-group">
        <label>Email</label>
        <input type="email" [(ngModel)]="email" name="email" placeholder="Enter your email" required>
      </div>

      <div class="input-group">
        <label>Password</label>
        <div class="password-wrapper">
          <input [type]="showPassword ? 'text' : 'password'" [(ngModel)]="password" name="password" placeholder="Create a password" required>
          <span class="toggle-password" (click)="showPassword = !showPassword">{{ showPassword ? 'Hide' : 'Show' }}</span>
        </div>
      </div>

      <div class="input-group">
        <label>Confirm Password</label>
        <div class="password-wrapper">
          <input [type]="showConfirmPassword ? 'text' : 'password'" [(ngModel)]="confirmPassword" name="confirmPassword" placeholder="Confirm password" required>
          <span class="toggle-password" (click)="showConfirmPassword = !showConfirmPassword">{{ showConfirmPassword ? 'Hide' : 'Show' }}</span>
        </div>
      </div>

      <button type="submit" class="login-btn">Register</button>
    </form>

    <p class="register-link">
      Already have an account? <a routerLink="/login">Login</a>
    </p>
  </div>
</div>
